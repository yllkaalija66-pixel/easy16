<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Galeria Imazheve</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1100px;
            margin: auto;
        }

        .gallery img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 10px;
            transition: transform 0.3s ease,
                        box-shadow 0.3s ease;
            cursor: pointer;
        }

        .gallery img:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            border: 3px solid #3498db;
        }
    </style>
</head>

<body>

    <h1>Galeria Ime e Fotografive</h1>

    <div class="gallery">

        <img src="https://picsum.photos/id/1015/600/400"
             alt="Pamje malore">

        <img src="https://picsum.photos/id/1011/600/400"
             alt="Pamje nga natyra">

        <img src="https://picsum.photos/id/1018/600/400"
             alt="Peizazh pyjor">

        <img src="https://picsum.photos/id/1020/600/400"
             alt="Natyra e bukur">

        <img src="https://picsum.photos/id/1039/600/400"
             alt="Lumi malor">

        <img src="https://picsum.photos/id/1043/600/400"
             alt="Pamje nga deti">

    </div>

</body>
</html>
